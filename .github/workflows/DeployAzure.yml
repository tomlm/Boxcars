name: Deploy to Azure

on:
  workflow_dispatch:
  push:
    branches:
      - main

# One deployment at a time; a newer push waits rather than cancelling an in-flight deploy.
concurrency:
  group: deploy-azure-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Boxcars.slnx -c Release

      - name: Publish
        run: dotnet publish src/Boxcars/Boxcars.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write # Required for OIDC login to Azure
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: webapp

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: boxcars
          package: webapp
