name: BuildAndRunTests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
    - src/**
    - tests/**
  # Every PR, not just src/tests changes: "build" is a required check, and one that never runs blocks the merge.
  pull_request:
    branches: [ "main" ]
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Boxcars.slnx
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Boxcars.slnx

    - name: Build
      run: dotnet build --no-restore Boxcars.slnx --property WarningLevel=0
      
    - name: Test
      run: dotnet test --no-build --verbosity normal Boxcars.slnx
